[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytpl-dl"
version = "0.1.0"
description = "Download all videos from a YouTube playlist in maximum quality."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.1",
    "typer>=0.12,<1.0",
    "structlog>=24.1",
]

[project.scripts]
ytpl-dl = "ytpl_dl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "-v"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
